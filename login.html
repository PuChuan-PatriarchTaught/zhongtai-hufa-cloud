<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>護法會雲端系統 - 精舍登入</title>
<style>
  body {
    font-family: "微軟正黑體", "PMingLiU", sans-serif;
    background: #f4f6f9;
    color: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .box {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    padding: 32px 36px;
    width: 360px;
    max-width: 90vw;
  }
  h1 {
    font-size: 20px;
    color: #1F3864;
    margin: 0 0 6px 0;
    text-align: center;
  }
  .sub {
    text-align: center;
    color: #666;
    font-size: 13px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-weight: bold;
    margin: 14px 0 6px 0;
    font-size: 14px;
  }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 8px 10px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 10px;
    background: #2E5395;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled {
    background: #99a8c2;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    background: #1F3864;
  }
  #msg {
    margin-top: 14px;
    font-size: 13px;
    min-height: 18px;
    text-align: center;
  }
  #msg.error { color: #c00; }
  #msg.info { color: #666; }
</style>
</head>
<body>

<div class="box">
  <h1>護法會雲端系統</h1>
  <div class="sub">請輸入貴精舍代碼與密碼登入</div>

  <label for="inputTempleCode">精舍代碼</label>
  <input type="text" id="inputTempleCode" autocomplete="off" placeholder="例如：TEST">

  <label for="inputPassword">密碼</label>
  <input type="password" id="inputPassword" placeholder="請輸入密碼（新精舍預設密碼為 1234）">

  <button id="btnLogin" onclick="處理登入按鈕點擊()">登入</button>

  <div id="msg"></div>
</div>

<script src="config.js"></script>
<script>

function 顯示訊息(str訊息內容, bool是否為錯誤) {
  const elMsg = document.getElementById("msg");
  elMsg.textContent = str訊息內容;
  elMsg.className = bool是否為錯誤 ? "error" : "info";
}

async function 處理登入按鈕點擊() {
  const str精舍代碼 = document.getElementById("inputTempleCode").value.trim();
  const str密碼 = document.getElementById("inputPassword").value;
  const btn登入按鈕 = document.getElementById("btnLogin");

  if (!str精舍代碼) {
    顯示訊息("請輸入精舍代碼。", true);
    return;
  }
  if (!str密碼) {
    顯示訊息("請輸入密碼。", true);
    return;
  }

  btn登入按鈕.disabled = true;
  顯示訊息("登入中，請稍候...", false);

  try {
    const objResult = await 呼叫後端API({
      system: "temple",
      action: "精舍登入",
      精舍代碼: str精舍代碼,
      密碼: str密碼
    });

    if (objResult.成功) {
      儲存登入精舍資訊(objResult.token, str精舍代碼, objResult.精舍顯示名稱 || str精舍代碼);
      顯示訊息("登入成功，正在跳轉...", false);
      window.location.href = "temple-admin.html";
    } else {
      顯示訊息(objResult.訊息 || "登入失敗，請確認精舍代碼與密碼是否正確。", true);
    }
  } catch (錯誤) {
    console.error("登入過程發生未預期錯誤：", 錯誤);
    顯示訊息("系統發生未預期錯誤，請稍後再試或聯絡工程人員。", true);
  } finally {
    btn登入按鈕.disabled = false;
  }
}

document.getElementById("inputPassword").addEventListener("keyup", function (event) {
  if (event.key === "Enter") {
    處理登入按鈕點擊();
  }
});

(function 檢查是否已登入() {
  const obj已登入資訊 = 取得目前登入精舍資訊();
  if (obj已登入資訊) {
    window.location.href = "temple-admin.html";
  }
})();

</script>

</body>
</html>
